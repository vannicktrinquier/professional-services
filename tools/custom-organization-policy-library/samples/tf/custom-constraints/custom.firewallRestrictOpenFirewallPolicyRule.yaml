custom.firewallRestrictOpenFirewallPolicyRule:
  action_type: DENY
  condition: |-
    (
      resource.rules.exists(rule,
        rule.priority < 2147483644 &&
        rule.direction == 'INGRESS' &&
        '0.0.0.0/0' in rule.match.srcIpRanges &&
        rule.match.layer4Configs.exists(l4,
          !(
            (l4.ipProtocol == 'icmp') ||
            (l4.ipProtocol == 'tcp' && l4.ports.exists(p, p in ['22','443','3389'])) ||
            (l4.ipProtocol == 'udp' && l4.ports.exists(p, p in ['3389']))
          )
        )
      )
    ) || (
      resource.rules.exists(rule,
        rule.priority < 2147483644 &&
        rule.direction == 'INGRESS' &&
        rule.match.srcIpRanges.exists(r,
          r != '0.0.0.0/0' && !r.startsWith('10.') && !r.startsWith('192.168.') && !r.startsWith('172.')
        ) &&
        rule.match.layer4Configs.exists(l4,
          (l4.ipProtocol == 'tcp' && (!has(l4.ports) || size(l4.ports) == 0)) ||
          (l4.ipProtocol == 'udp' && (!has(l4.ports) || size(l4.ports) == 0))
        )
      )
    )
  description: Prevent Firewall Policy rules that are open to 0.0.0.0/0 (except for
    safe protocols like ICMP, SSH, HTTPS, RDP) or allow all TCP/UDP ports from non-private
    IPs
  display_name: Restrict overly permissive Firewall Policy rules open to the Internet
  method_types:
  - CREATE
  - UPDATE
  resource_types:
  - compute.googleapis.com/FirewallPolicy
