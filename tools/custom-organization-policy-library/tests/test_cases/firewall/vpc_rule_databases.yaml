shared_config:
  command:  gcloud compute firewall-rules create allow-db-{{ identifier }}
  teardown_command: gcloud compute firewall-rules delete allow-db-{{ identifier }}
  default_command_flags:
      action: ALLOW
      direction: INGRESS
      network: vpc-dev-cuop-library
      priority: 1000
      description: Testing database firewall rule
      enable-logging: true
  default_markers:
    - firewall
    - firewall-vpc-rule
    - databases

# MySQL tests - TCP 3306
firewall_vpc_allowed_mysql_rule_192:
  steps:
  - command_flags:
      rules: tcp:3306
      source-ranges: 192.168.1.0/24
    expected_result:
      return_code: 0

firewall_vpc_allowed_mysql_rule_10:
  steps:
  - command_flags:
      rules: tcp:3306
      source-ranges: 10.0.1.0/24
    expected_result:
      return_code: 0

firewall_vpc_mysql_rule_denied:
  steps:
  - command_flags:
      rules: tcp:3306
      source-ranges: 1.0.0.0/32
    expected_result:
      return_code: 1
      stderr: "customConstraints/custom.firewallRestrictDatabasesRule"

