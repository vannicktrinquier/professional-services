shared_config:
  command:  gcloud compute network-firewall-policies rules create 1000 --firewall-policy cuop-fw-policy --global-firewall-policy
  teardown_command: gcloud compute network-firewall-policies rules delete 1000 --firewall-policy cuop-fw-policy --global-firewall-policy
  default_command_flags:
      action: ALLOW
      direction: INGRESS
      enable-logging: true
  default_markers:
    - firewall
    - firewall-policy
    - open-firewall

# Allowed: Safe protocols with 0.0.0.0/0
firewall_policy_allowed_icmp_world:
  steps:
  - command_flags:
      layer4-configs: icmp
      src-ip-ranges: 0.0.0.0/0
    expected_result:
      return_code: 0

firewall_policy_allowed_ssh_world:
  steps:
  - command_flags:
      layer4-configs: tcp:22
      src-ip-ranges: 0.0.0.0/0
    expected_result:
      return_code: 1
      stderr: 'customConstraints/custom\.firewallRestrictSshPolicyRule'

firewall_policy_allowed_https_world:
  steps:
  - command_flags:
      layer4-configs: tcp:443
      src-ip-ranges: 0.0.0.0/0
    expected_result:
      return_code: 0

firewall_policy_allowed_rdp_tcp_world:
  steps:
  - command_flags:
      layer4-configs: tcp:3389
      src-ip-ranges: 0.0.0.0/0
    expected_result:
      return_code: 1
      stderr: 'customConstraints/custom\.firewallRestrictRdpPolicyRule'

firewall_policy_allowed_rdp_udp_world:
  steps:
  - command_flags:
      layer4-configs: udp:3389
      src-ip-ranges: 0.0.0.0/0
    expected_result:
      return_code: 0

# Denied: Unsafe protocols with 0.0.0.0/0
firewall_policy_denied_http_world:
  steps:
  - command_flags:
      layer4-configs: tcp:80
      src-ip-ranges: 0.0.0.0/0
    expected_result:
      return_code: 1
      stderr: 'customConstraints/custom\.firewallRestrictInsecureProtocolsPolicyRule'

firewall_policy_denied_custom_port_world:
  steps:
  - command_flags:
      layer4-configs: tcp:8080
      src-ip-ranges: 0.0.0.0/0
    expected_result:
      return_code: 1
      stderr: 'customConstraints/custom\.firewallRestrictOpenFirewallPolicyRule'

firewall_policy_denied_mysql_world:
  steps:
  - command_flags:
      layer4-configs: tcp:3306
      src-ip-ranges: 0.0.0.0/0
    expected_result:
      return_code: 1
      stderr: 'customConstraints/custom\.firewallRestrictSQLDatabasesPolicyRule'

# Denied: All TCP/UDP from public IP
firewall_policy_denied_all_tcp_public:
  steps:
  - command_flags:
      layer4-configs: tcp
      src-ip-ranges: 8.8.8.8/32
    expected_result:
      return_code: 1
      stderr: 'customConstraints/custom\.firewallRestrict(Ssh|Rdp)PolicyRule'

firewall_policy_denied_all_udp_public:
  steps:
  - command_flags:
      layer4-configs: udp
      src-ip-ranges: 1.1.1.1/32
    expected_result:
      return_code: 1
      stderr: 'customConstraints/custom\.firewallRestrictOpenFirewallPolicyRule'

# Allowed: Specific port from public IP (not all ports)
firewall_policy_allowed_http_public_specific:
  steps:
  - command_flags:
      layer4-configs: tcp:80
      src-ip-ranges: 8.8.8.8/32
    expected_result:
      return_code: 1
      stderr: 'customConstraints/custom\.firewallRestrictInsecureProtocolsPolicyRule'

# Allowed: All TCP/UDP from private IP
firewall_policy_allowed_all_tcp_private:
  steps:
  - command_flags:
      layer4-configs: tcp
      src-ip-ranges: 10.0.0.0/8
    expected_result:
      return_code: 0

firewall_policy_allowed_all_udp_private:
  steps:
  - command_flags:
      layer4-configs: udp
      src-ip-ranges: 192.168.1.0/24
    expected_result:
      return_code: 0
