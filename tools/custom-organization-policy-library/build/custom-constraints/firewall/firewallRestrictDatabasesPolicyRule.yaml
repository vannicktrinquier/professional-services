#@   tcp_ports_list = ['7000', '7001', '7199', '8888', '9042', '9160', '61620', '61621', '9200', '9300', '11211', '11214', '11215', '27017', '27018', '27019', '3306', '1521', '2483', '2484', '5432', '6379']
#@   udp_ports_list = ['11211', '11214', '11215', '2483', '2484', '5432']
#@   source_check = '!rule.match.srcIpRanges.all(ipRange, ipRange in ' + str(allowed_source_ranges) + ')'
