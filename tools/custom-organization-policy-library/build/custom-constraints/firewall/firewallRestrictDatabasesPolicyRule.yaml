#@   udp_ports = "port in " + str(udp_ports_list)
#@   return "resource.rules.exists(rule, rule.priority < 2147483644 && rule.direction == 'INGRESS' && " + source_check + " && rule.match.layer4Configs.exists(l4config, (l4config.ipProtocol == 'tcp' && l4config.ports.exists(port, " + tcp_ports + ")) || (l4config.ipProtocol == 'udp' && l4config.ports.exists(port, " + udp_ports + "))))"
