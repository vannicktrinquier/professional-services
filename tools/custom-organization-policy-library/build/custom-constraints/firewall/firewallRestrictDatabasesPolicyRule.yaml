#@ if constraint.to_generate():
name: #@ constraint.constraint_name()
resource_types:
- compute.googleapis.com/FirewallPolicy
condition: #@ build_condition(constraint.params().allowed_source_ranges)
action_type: DENY
method_types:
- CREATE
- UPDATE
display_name: Restrict Firewall Policy rules allowing database port access from the Internet
description: Ensure that common database ports (Cassandra, Elasticsearch, Memcached, MongoDB, MySQL, Oracle, PostgreSQL, Redis) are not accessible from the Internet when using Firewall Policy Rule
#@ end
