#@ if constraint.to_generate():
name: #@ constraint.constraint_name()
resource_types:
- compute.googleapis.com/Firewall
condition: #@ condition(constraint.params().allowed_source_ranges)
action_type: DENY
method_types:
- CREATE
- UPDATE
display_name: Restrict VPC Firewall rules allowing NoSQL database port access from the Internet
description: Ensure that NoSQL database ports (Cassandra, MongoDB) are not accessible from the Internet when using VPC Firewall Rule
