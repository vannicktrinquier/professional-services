#@ load("/constraints.lib.star", "build_constraint")
#@ constraint = build_constraint("cloudsqlRequirePostgreSQLDatabasefs")

#@ if constraint.to_generate():
name: #@ constraint.constraint_name()
resourceTypes:
- sqladmin.googleapis.com/Instance
methodTypes:
- CREATE
- UPDATE
condition: >-
  resource.databaseVersion.startsWith('POSTGRES') && (
    !resource.settings.databasefs.exists(f,
      f.name == 'log_connections' && f.value == 'on'
    ) ||
    !resource.settings.databasefs.exists(f,
      f.name == 'log_disconnections' && f.value == 'on'
    ) ||
    !resource.settings.databasefs.exists(f,
      f.name == 'log_min_duration_statement' && f.value == '-1'
    ) ||
    !resource.settings.databasefs.exists(f,
      f.name == 'cloudsql.enable_pgaudit' && f.value == 'on'
    ) ||
    resource.settings.databasefs.exists(f,
      f.name == 'log_min_messages' && f.value in ['error' , 'log', 'fatal', 'panic']
    ) ||
    resource.settings.databasefs.exists(f,
      f.name == 'log_min_error_statement' && f.value in ['log', 'fatal', 'panic']
    ) ||
    resource.settings.databasefs.exists(f,
      f.name == 'log_error_verbosity' && f.value in ['terse']
    ) ||
    resource.settings.databasefs.exists(f,
      f.name == 'log_statement' && f.value in ['none']
    )
  )
actionType: DENY
display_name: Require Cloud SQL for PostgreSQL instance database fs to be configured correctly (e.g log_connections)
description: Ensure Cloud SQL for PostgreSQL instance database fs are set correctly (e.g log_connections)
#@ end
